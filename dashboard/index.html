<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>__TOKENTRACKER_TITLE__</title>
    <meta name="description" content="__TOKENTRACKER_DESCRIPTION__" />
    <meta property="og:site_name" content="__TOKENTRACKER_OG_SITE_NAME__" />
    <meta property="og:title" content="__TOKENTRACKER_OG_TITLE__" />
    <meta property="og:description" content="__TOKENTRACKER_OG_DESCRIPTION__" />
    <meta property="og:image" content="__TOKENTRACKER_OG_IMAGE__" />
    <meta property="og:type" content="__TOKENTRACKER_OG_TYPE__" />
    <meta property="og:url" content="__TOKENTRACKER_OG_URL__" />
    <meta name="twitter:card" content="__TOKENTRACKER_TWITTER_CARD__" />
    <meta name="twitter:title" content="__TOKENTRACKER_TWITTER_TITLE__" />
    <meta name="twitter:description" content="__TOKENTRACKER_TWITTER_DESCRIPTION__" />
    <meta name="twitter:image" content="__TOKENTRACKER_TWITTER_IMAGE__" />
    <link rel="canonical" href="__TOKENTRACKER_OG_URL__" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <script>
      // ES2022 built-in polyfills for WebKit < 15.4 (macOS 12.0 Monterey ships Safari 15.0).
      // Base UI uses Object.hasOwn and TrendMonitor uses Array.prototype.at — both land in
      // Safari 15.4; esbuild down-levels syntax but never polyfills built-ins, so without this
      // the dashboard crashes with "Object.hasOwn is not a function". Run before the bundle.
      (function () {
        try {
          if (typeof Object.hasOwn !== "function") {
            Object.defineProperty(Object, "hasOwn", {
              value: function (o, k) { return Object.prototype.hasOwnProperty.call(o, k); },
              configurable: true, writable: true,
            });
          }
          function at(n) {
            n = Math.trunc(n) || 0;
            if (n < 0) n += this.length;
            return n < 0 || n >= this.length ? undefined : this[n];
          }
          if (typeof Array.prototype.at !== "function") {
            Object.defineProperty(Array.prototype, "at", { value: at, configurable: true, writable: true });
          }
          if (typeof String.prototype.at !== "function") {
            Object.defineProperty(String.prototype, "at", { value: at, configurable: true, writable: true });
          }
        } catch (e) {}
      })();
      document.documentElement.classList.add("js");
      // TokenTrackerBar WKWebView: mark before first paint so inline CSS below can clear html/body (NSVisualEffectView shows through).
      (function () {
        try {
          if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.nativeBridge) {
            document.documentElement.classList.add("native-app");
          }
        } catch (e) {}
      })();
      // Sync theme before first paint to prevent dark→light flash (FOUC)
      (function(){
        var t, period;
        try { t = localStorage.getItem("tokentracker-theme"); } catch(e) {}
        try { period = localStorage.getItem("tokentracker-neon-store-period"); } catch(e) {}
        var root = document.documentElement;
        var neon = t === "neon-store";
        var neonDay = neon && period === "day";
        var dark = t === "dark" || (neon && !neonDay) || (t !== "light" && !neon && matchMedia("(prefers-color-scheme:dark)").matches);
        if (dark) root.classList.add("dark");
        if (neon) root.classList.add("neon-store");
        if (neonDay) root.classList.add("neon-store-day");
      })();
    </script>
    <style>
      /* Prevent dark flash: set background before CSS loads */
      html { background: #fafafa; }
      html.dark { background: #0a0a0a; }
      /* Native app: must override the two lines above — otherwise WKWebView stays opaque over NSVisualEffectView */
      html.native-app,
      html.native-app.dark {
        background: transparent !important;
      }
      html.native-app body {
        background: transparent !important;
      }
    </style>
    </head>
  <body>
    
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
