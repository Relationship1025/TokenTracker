name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: test + validate + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Node 24 matches the local toolchain. The test suite imports
          # dashboard .ts files directly (native type stripping, Node 22.18+)
          # and exercises undici 8 (needs webidl.markAsUncloneable), so Node 20
          # cannot run the suite even though the CLI targets it.
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            dashboard/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install dashboard dependencies
        run: npm ci --prefix dashboard

      # Build the dashboard up front: the local-runtime install test asserts the
      # bundled dashboard/dist/index.html exists, and a fresh checkout has none.
      - name: Build dashboard
        run: npm run dashboard:build

      - name: Test skill management interactions
        run: npm --prefix dashboard test -- src/pages/SkillsPage.test.jsx

      - name: Test dashboard preferences and card lifecycle
        run: npm --prefix dashboard test -- src/hooks/use-limits-display-prefs.test.js src/ui/dashboard/views/DashboardView.test.jsx

      # The bot character's renderer and its cross-host contracts live on the
      # dashboard side, so npm test alone does not cover them; test/bot-parity.test.js
      # only pins the values, not the rendering.
      - name: Test bot companion renderer
        run: npm --prefix dashboard test -- src/ui/foundation/BotAnimated.test.jsx src/lib/pets-api.test.js

      - name: Test and validate
        run: |
          npm test
          npm run validate:copy
          npm run validate:locale
          npm run validate:ui-hardcode
          npm run validate:guardrails
          npm run validate:versions
          node --test test/architecture-guardrails.test.js
